# Runs job scripts only after they are merged into main, so every job is reviewed in a pull request first.
name: jobs
on:
  push:
    branches: [main]
    paths: ['jobs/*.py']
permissions:
  contents: write
concurrency: jobs
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            jobs
            results
            bg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pillow numpy opencv-python-headless
      - name: Run jobs that have no result yet
        env:
          SHOPIFY_STORE: the-rebel-store.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
        run: |
          mkdir -p results
          for f in jobs/*.py; do
            n=$(basename "$f" .py)
            if [ ! -f "results/$n.log" ]; then
              PYTHONPATH=tools timeout 6000 python "$f" > "results/$n.log" 2>&1 || echo "EXIT $?" >> "results/$n.log"
              tail -n 5 "results/$n.log"
            fi
          done
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -q -m "Job results" || exit 0
          git pull -q --rebase
          git push -q
